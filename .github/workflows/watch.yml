name: Booking Apartments Watch

on:
  schedule:
    # Every 4 hours at minute 0 (UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Check availability and notify
        env:
          NTFY_TOPIC: esty-waldrand-aug2026-watch
        run: python check.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json config.json
          git diff --staged --quiet || git commit -m "Update availability state [skip ci]"
          git push
